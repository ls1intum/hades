version: "2"

# Shared golangci-lint configuration for all Hades Go modules.
# Run per module via `make lint` (each module has its own go.mod).
linters:
  # "standard" enables errcheck, govet, ineffassign, staticcheck and unused -
  # a sensible, low-noise baseline shared across every module.
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -QF1008 # keep embedded-field selectors for readability
        - -SA1019 # deprecations are tracked separately, not lint-blocking
        - -ST1* # do not enforce the opinionated stylecheck naming/comment rules
  exclusions:
    # Allow the common idiom of not checking errors from deferred Close(),
    # fmt.Print*, os.Setenv, etc.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
