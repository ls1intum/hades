# docker compose file for the project with three services

version: '3.7'
services:
  hadesAPI:
    image: ghcr.io/ls1intum/hades/hades-api
    build:
      context: .
      dockerfile: ./HadesAPI/Dockerfile
    ports:
      # Set the Port to 8081 to avoid conflicts with the artemis server
      - "8081:8080"
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats:4222

  hadesScheduler:
    image: ghcr.io/ls1intum/hades/hades-scheduler
    build:
      context: .
      dockerfile: ./HadesScheduler/Dockerfile
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
      hadesAPI:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - HADES_EXECUTOR=docker

  hadesLogManager:
    image: ghcr.io/ls1intum/hades/hades-logmanager
    build:
      context: .
      dockerfile: ./HadesLogManager/Dockerfile
    ports:
      # Exposed on 8082 to avoid conflict with hadesAPI on 8081
      - "8082:8081"
    networks:
      - hades
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats:4222

  hadesWebhook:
    build:
      context: .
      dockerfile: ./HadesWebhook/Dockerfile
    ports:
      - "8083:8083"
    networks:
      - hades
    depends_on:
      hadesAPI:
        condition: service_started
    environment:
      - HADES_API_URL=http://hadesAPI:8080
      # HADES_AUTH_KEY=          # set if HadesAPI AUTH_KEY is configured
      # GITHUB_WEBHOOK_SECRET=   # required for production; leave empty to skip validation
      # JOB_TEMPLATE_PATH=       # path to a .json.tmpl file mounted into the container
      # ALLOWED_EVENTS=push,pull_request

  nats:
    image: nats:2.11.4
    command: ["-js", "-m", "8222"]
    networks:
      - hades
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "nats-server", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  hades:
