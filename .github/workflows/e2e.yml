name: Dashboard E2E

# Playwright end-to-end tests for the operator dashboard. Runs the whole stack
# (a NATS container + HadesAPI serving the embedded SPA) and drives it in a real
# browser. Kept separate from ci.yml so the heavier browser/e2e job only runs
# when the dashboard changes or on demand.
on:
  pull_request:
    branches: [main]
    paths:
      - "HadesAPI/**"
      - "shared/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/*.sum"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HadesAPI/web/package-lock.json
      - name: Install SPA dependencies
        run: cd HadesAPI/web && npm ci
      - name: Install Playwright browser
        run: cd HadesAPI/web && npx playwright install --with-deps chromium
      - name: Run e2e tests
        # serve.sh starts a NATS container (docker is available on the runner),
        # builds the SPA and API, and boots the stack.
        run: cd HadesAPI/web && npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: HadesAPI/web/playwright-report/
          retention-days: 7
