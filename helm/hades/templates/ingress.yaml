{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "hades-ingress"
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if $annotations }}
  annotations:
    {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Hades API
          - path: /build
            pathType: Prefix
            backend:
              service:
                name: "hades-api-service"
                port:
                  number: {{ .Values.hadesApi.service.port }}
          {{- if .Values.hadesApi.dashboard.secretName }}
          # Dashboard API (login, jobs, logs, metrics, live stream)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: "hades-api-service"
                port:
                  number: {{ .Values.hadesApi.service.port }}
          # Dashboard SPA (served for all remaining paths). Keep this last so the
          # more specific /build and /api rules match first.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "hades-api-service"
                port:
                  number: {{ .Values.hadesApi.service.port }}
          {{- end }}
{{- end }}