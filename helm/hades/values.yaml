# Global debug switch. When true, every Hades container gets DEBUG=true
# (and the operator additionally gets DEV_MODE=true) for verbose logging.
debug: false

hadesApi:
  image:
    repository: ghcr.io/ls1intum/hades/hades-api
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # Name of an existing Secret holding key AUTH_KEY to protect the /build endpoint.
  # Empty = no auth (endpoint is open).
  authKeySecret: ""

hadesScheduler:
  image:
    repository: ghcr.io/ls1intum/hades/hades-scheduler
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  executor: "k8s"
  configMode: "operator"

hadesOperator:
  image:
    repository: ghcr.io/ls1intum/hades/hades-operator
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  clusterWide: false
  leaderElection:
    enabled: true
  targetNamespace: ""
  DeleteOnComplete: true
  maxParallelism: "100"

hadesLogManager:
  image:
    repository: ghcr.io/ls1intum/hades/hades-log-manager
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  # Keep at 1: the log manager aggregates per-job logs in memory and uses plain
  # (non-queue, non-durable) NATS subscriptions, so multiple replicas would
  # independently forward duplicate/split logs to the Artemis adapter.
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # Where aggregated job logs are forwarded is configured per job via the
  # "callback_url" field on the build request, not globally on the log manager.

rbac:
  hadesScheduler:
    serviceAccountName: hades-scheduler
    role:
      name: hades-scheduler-role
  hadesOperator:
    serviceAccountName: hades-operator
    role:
      name: hades-operator-role

ingress:
  enabled: true
  className: "nginx"

  host: hades.student.k8s.aet.cit.tum.de

  tls:
    enabled: true
    secretName: hades-tls

  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

nats:
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 1Gi
      # fileStore:
      #   enabled: true
      #   dir: /data
      #   pvc:
      #     enabled: true
      #     size: 10Gi
      #   maxSize: 10Gi
  host: "hades-nats.hades.svc.cluster.local"
  port: 4222