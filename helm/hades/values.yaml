hadesApi:
  image:
    repository: ghcr.io/ls1intum/hades/hades-api
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # Name of an existing Secret holding key AUTH_KEY to protect the /build endpoint.
  # Empty = no auth (endpoint is open).
  authKeySecret: ""

hadesScheduler:
  image:
    repository: ghcr.io/ls1intum/hades/hades-scheduler
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  executor: "k8s"
  configMode: "operator"

hadesOperator:
  image:
    repository: ghcr.io/ls1intum/hades/hades-operator
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  clusterWide: false
  leaderElection:
    enabled: true
  targetNamespace: ""
  DeleteOnComplete: true
  maxParallelism: "100"

hadesLogManager:
  image:
    repository: ghcr.io/ls1intum/hades/hades-log-manager
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  # External Artemis adapter endpoint the log manager forwards aggregated job logs to.
  artemisAdapterUrl: "http://hades-artemis-adapter.hades-artemis-connector.svc.cluster.local:8082/adapter/logs"

rbac:
  hadesScheduler:
    serviceAccountName: hades-scheduler
    role:
      name: hades-scheduler-role
  hadesOperator:
    serviceAccountName: hades-operator
    role:
      name: hades-operator-role

ingress:
  enabled: true
  className: "nginx"

  host: hades.student.k8s.aet.cit.tum.de

  tls:
    enabled: true
    secretName: hades-tls

  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

nats:
  config:
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 1Gi
      # fileStore:
      #   enabled: true
      #   dir: /data
      #   pvc:
      #     enabled: true
      #     size: 10Gi
      #   maxSize: 10Gi
  host: "hades-nats.hades.svc.cluster.local"
  port: 4222